[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "carconnectivity-connector-lucid"
description = "CarConnectivity connector for Lucid Motors vehicles"
dynamic = ["version"]
# lucidmotors requires ^3.12, so 3.10 and 3.11 cannot install this at all.
# Claiming them made pip fail on a dependency instead of refusing cleanly here.
requires-python = ">=3.12"
authors = [{ name = "Eric Pheterson" }]
dependencies = [
    "carconnectivity>=0.11.5",
    # login_with_refresh_token() is merged upstream but unreleased (last tag v1.1.9).
    # Pin the git ref until nshp cuts a release; see README.
    "lucidmotors @ git+https://github.com/nshp/python-lucidmotors.git@13087ad",  # main at 2026-09-05; has login_with_refresh_token(), unreleased upstream
]
readme = "README.md"
keywords = ["lucid", "carconnectivity", "ev", "telemetry", "connector"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/epheterson/CarConnectivity-connector-lucid"
Issues = "https://github.com/epheterson/CarConnectivity-connector-lucid/issues"
Changelog = "https://github.com/epheterson/CarConnectivity-connector-lucid/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools_scm]
write_to = "src/carconnectivity_connectors/lucid/_version.py"

# flake8 allows 160 columns; tell black the same so it does not reflow this repo
# into a narrower style than its own linter asks for.
[tool.black]
line-length = 160

[tool.pylint.format]
max-line-length = 160
ignore-patterns = "_version.py"

[tool.bandit]
exclude_dirs = [".venv", "venv", "build", "dist", "test"]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = [
    # pytimeparse (a CarConnectivity dependency) still uses codecs.open(); not our code.
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:pytimeparse",
]
