[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "carconnectivity-connector-lucid"
description = "CarConnectivity connector for Lucid Motors vehicles"
dynamic = ["version"]
requires-python = ">=3.10"
authors = [{ name = "Eric Pheterson" }]
dependencies = [
    "carconnectivity>=0.11.5",
    # login_with_refresh_token() is merged upstream but unreleased (last tag v1.1.9).
    # Pin the git ref until nshp cuts a release; see README.
    "lucidmotors @ git+https://github.com/nshp/python-lucidmotors.git@main",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools_scm]
write_to = "src/carconnectivity_connectors/lucid/_version.py"

[tool.pylint.format]
max-line-length = 160
ignore-patterns = "_version.py"

[tool.bandit]
exclude_dirs = [".venv", "venv", "build", "dist", "test"]
