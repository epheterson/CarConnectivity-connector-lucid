name: Build Python Package

# Controls when the action will run. 
on:
  # Push to main and every tag; pull requests too. The paths list has to include the
  # tooling files, or a dependency bump to the linters is merged without ever running.
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths:
     - .github/workflows/build.yml
     - '**.py'
     - 'pyproject.toml'
     - 'setup_requirements.txt'
     - 'Makefile'
  pull_request:
    paths:
     - .github/workflows/build.yml
     - '**.py'
     - 'pyproject.toml'
     - 'setup_requirements.txt'
     - 'Makefile'

jobs:
  build-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f setup_requirements.txt ]; then pip install -r setup_requirements.txt; fi
        python -m pip install build
    - name: Test
      run: |
        python -m pip install -e .
        python -m pip install pytest
        python -m pytest -q
    - name: Build
      run: |
        python -m build
    - name: Install built package
      run: |
        pip install --pre dist/*.whl
    - name: Run
      run: |
        set +e
        output=$(carconnectivity test/integration_test/carConnectivity.json 2>&1)
        echo "$output" | grep -q 'There was a problem when authenticating with one or multiple services'
        if [ $? -ne 0 ]; then
          echo "$output"
          exit 1
        fi
        set -e
    - name: Lint
      run: |
        make lint




