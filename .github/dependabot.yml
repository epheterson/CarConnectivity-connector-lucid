# Quiet mode (Eric, 2026-10-06: "can the checks be silent if nothing"):
# routine version-update PRs are off (limit 0). Dependabot still opens a PR
# only when a security advisory affects a dependency here.
version: 2
updates:
  # Weekly and grouped. Daily and ungrouped produced six pull requests in one minute on
  # the day this repo was published, for four linter bumps and two action bumps — enough
  # noise to hide the one CI failure that mattered.
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0  # quiet: no routine version PRs; security updates still open
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    open-pull-requests-limit: 0  # quiet: no routine version PRs; security updates still open
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns: ["*"]
