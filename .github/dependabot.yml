version: 2
updates:
  # Weekly and grouped. Daily and ungrouped produced six pull requests in one minute on
  # the day this repo was published, for four linter bumps and two action bumps — enough
  # noise to hide the one CI failure that mattered.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns: ["*"]
